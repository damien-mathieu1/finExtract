name: Deploy

# Called by create-release.yml. Run it by hand with an existing tag to roll back.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v2026.11.1
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GCP_REGION: us-central1

# Deny all permissions by default — each job opts in to exactly what it needs.
permissions: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      frontend_image: ${{ steps.tags.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "api_repo=${REGISTRY}/${REPO}-api" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=${REGISTRY}/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${REPO}-api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${REPO}-frontend:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ steps.tags.outputs.api_repo }}:latest
          build-args: |
            APP_VERSION=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend_image }}
            ${{ steps.tags.outputs.frontend_repo }}:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # Cloud Run pulls ghcr.io images unauthenticated, so the packages must be
      # public. One-time setup: after the first build-push run, go to
      # github.com/<owner>/<repo>/pkgs/container/FinExtract-api (and -frontend)
      # -> Package settings -> Change visibility -> Public.

      - name: Deploy api to Cloud Run
        run: |
          gcloud run deploy finextract-api \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ needs.build-push.outputs.api_image }}"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy finextract-frontend \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ needs.build-push.outputs.frontend_image }}"
